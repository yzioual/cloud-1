---
- name: Install Docker via Ubuntu upstream repository
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Force systemd to reread configs
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Ensure Docker is enabled and active
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add remote user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  notify: Reset SSH connection
