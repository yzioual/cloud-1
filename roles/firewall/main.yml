---

- name: Configure UFW
  hosts: all
  become: true

  tasks:
    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Set deafult incoming policy to deny
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Set deafult outgoing policy ot allow
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow SSH
      community.general.ufw:
        rule: limit
        port: '22'
        proto: tcp

    - name: Allow HTTP and HTTPS traffic
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Enable UFW firewall and ensure it starts on boot
      community.general.ufw:
        state: enabled
