---

- name: Deploy WordPress stack
  hosts: all
  become: true

  tasks:
    - name: Create WordPress environment file
      ansible.builtin.copy:
        src: .env.j2
        dest: /opt/wordpress/.env
        owner: root
        group: root
        mode: '0600'

    - name: Copy WordPress project
      ansible.builtin.copy:
        src: ../../web/
        dest: /opt/wordpress/

    - name: Start WordPress stack
      community.docker.docker_compose_v2:
        project_src: /opt/wordpress/
        state: present
